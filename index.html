<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>CRM для строительной компании — frontend only</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <h1>CRM (Frontend-only, HTML + JS)</h1>
  <nav>
    <button data-route="dashboard">Дашборд</button>
    <button data-route="projects">Проекты</button>
    <button data-route="objects">Объекты</button>
    <button data-route="tasks">Задачи</button>
    <button data-route="finance">Финансы</button>
    <button data-route="docs">Документы</button>
    <button data-route="users">Сотрудники</button>
    <button data-route="export">Экспорт/Импорт</button>
  </nav>

  <main id="app"></main>

  <template id="tpl-dashboard">
    <h2>Дашборд</h2>
    <div id="summary"></div>
  </template>

  <template id="tpl-projects">
    <h2>Проекты</h2>
    <div>
      <input id="project-search" placeholder="Поиск проекта">
      <button id="add-project">Добавить проект</button>
    </div>
    <ul id="projects-list"></ul>
  </template>

  <template id="tpl-objects">
    <h2>Объекты</h2>
    <div>
      <input id="object-search" placeholder="Поиск объекта">
      <button id="add-object">Добавить объект</button>
    </div>
    <ul id="objects-list"></ul>
  </template>

  <template id="tpl-tasks">
    <h2>Задачи</h2>
    <div>
      <button id="add-task">Добавить задачу</button>
      <select id="filter-status"><option value="all">Все</option><option value="todo">To do</option><option value="inprogress">In progress</option><option value="done">Done</option></select>
    </div>
    <ul id="tasks-list"></ul>
  </template>

  <template id="tpl-finance">
    <h2>Финансы</h2>
    <div>
      <button id="add-entry">Добавить запись</button>
    </div>
    <table id="finance-table" border="1"><thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Проект</th><th>Описание</th><th>Действия</th></tr></thead><tbody></tbody></table>
  </template>

  <template id="tpl-docs">
    <h2>Документы</h2>
    <div>
      <input type="file" id="doc-file">
      <input id="doc-title" placeholder="Название документа">
      <button id="upload-doc">Загрузить</button>
    </div>
    <ul id="docs-list"></ul>
  </template>

  <template id="tpl-users">
    <h2>Сотрудники</h2>
    <div>
      <button id="add-user">Добавить сотрудника</button>
    </div>
    <ul id="users-list"></ul>
  </template>

  <template id="tpl-export">
    <h2>Экспорт / Импорт данных</h2>
    <div>
      <button id="export-json">Экспорт в JSON</button>
      <input type="file" id="import-json">
      <button id="import-button">Импортировать</button>
      <button id="clear-all">Очистить всё (локально)</button>
    </div>
    <pre id="export-output"></pre>
  </template>

  <script>
  // Простая frontend CRM: хранение в localStorage, модульный SPA

  const DB = {
    projectsKey: 'crm_projects',
    objectsKey: 'crm_objects',
    tasksKey: 'crm_tasks',
    financeKey: 'crm_finance',
    docsKey: 'crm_docs',
    usersKey: 'crm_users'
  };

  // утилиты
  function uid(prefix='id'){
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function save(key, data){ localStorage.setItem(key, JSON.stringify(data)); }
  function load(key){ return JSON.parse(localStorage.getItem(key) || '[]'); }

  // инициализация демоданных если пусто
  function ensureDemo(){
    if(!localStorage.getItem(DB.usersKey)){
      save(DB.usersKey, [
        {id:uid('user'), name:'Иван Иванов', role:'Прораб', phone:'', email:''},
        {id:uid('user'), name:'Мария Петрова', role:'Бухгалтер', phone:'', email:''}
      ]);
    }
    if(!localStorage.getItem(DB.projectsKey)){
      const p1 = {id:uid('proj'), name:'ЖК Лесной', client:'ООО Заказчик', status:'active', budget:20000000, objects:[]};
      save(DB.projectsKey, [p1]);
    }
    if(!localStorage.getItem(DB.objectsKey)){
      save(DB.objectsKey, [
        {id:uid('obj'), name:'Корпус A, фундамент', projectId: load(DB.projectsKey)[0].id, status:'building', address:'ул. Строителей, 1'}
      ]);
    }
    if(!localStorage.getItem(DB.tasksKey)){
      save(DB.tasksKey, [
        {id:uid('task'), title:'Привезти арматуру', status:'todo', assignedTo:null, projectId: load(DB.projectsKey)[0].id, objectId: load(DB.objectsKey)[0].id, due: null, notes:''}
      ]);
    }
    if(!localStorage.getItem(DB.financeKey)) save(DB.financeKey, []);
    if(!localStorage.getItem(DB.docsKey)) save(DB.docsKey, []);
  }

  ensureDemo();

  // роутер SPA
  const routes = {
    dashboard: renderDashboard,
    projects: renderProjects,
    objects: renderObjects,
    tasks: renderTasks,
    finance: renderFinance,
    docs: renderDocs,
    users: renderUsers,
    export: renderExport
  };

  document.querySelectorAll('nav button').forEach(b=> b.addEventListener('click', ()=> navigate(b.dataset.route)));

  function navigate(route){
    const main = document.getElementById('app');
    main.innerHTML = '';
    const tpl = document.getElementById('tpl-'+route);
    if(!tpl) return main.innerText = 'Нет шаблона';
    main.appendChild(tpl.content.cloneNode(true));
    routes[route]();
  }

  // --- Dashboard ---
  function renderDashboard(){
    const projects = load(DB.projectsKey);
    const objs = load(DB.objectsKey);
    const tasks = load(DB.tasksKey);
    const finance = load(DB.financeKey);
    const users = load(DB.usersKey);
    const summary = document.getElementById('summary');
    summary.innerHTML = `
      <p>Проектов: ${projects.length}</p>
      <p>Объектов: ${objs.length}</p>
      <p>Задач: ${tasks.length} (todo: ${tasks.filter(t=>t.status==='todo').length})</p>
      <p>Финансовых записей: ${finance.length}</p>
      <p>Сотрудников: ${users.length}</p>
    `;
  }

  // --- Projects ---
  function renderProjects(){
    const list = document.getElementById('projects-list');
    const data = load(DB.projectsKey);
    const search = document.getElementById('project-search');
    function redraw(filter=''){
      list.innerHTML = '';
      data.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase())).forEach(p=>{
        const li = document.createElement('li');
        li.innerHTML = `<strong>${p.name}</strong> — ${p.client || ''} — статус: ${p.status || ''} — бюджет: ${p.budget || 0} <button data-id="${p.id}" class="edit">Редактировать</button> <button data-id="${p.id}" class="del">Удалить</button>`;
        list.appendChild(li);
      });
      list.querySelectorAll('.edit').forEach(b=> b.addEventListener('click', e=> editProject(e.target.dataset.id)));
      list.querySelectorAll('.del').forEach(b=> b.addEventListener('click', e=>{ if(confirm('Удалить проект?')){ const idx = data.findIndex(x=>x.id===e.target.dataset.id); if(idx>=0){ data.splice(idx,1); save(DB.projectsKey,data); renderProjects(); }}}));
    }
    search.addEventListener('input', ()=> redraw(search.value));
    document.getElementById('add-project').addEventListener('click', ()=>{
      const name = prompt('Название проекта'); if(!name) return;
      const client = prompt('Клиент') || '';
      const budget = Number(prompt('Бюджет', '0')||0);
      const proj = {id:uid('proj'), name, client, status:'planning', budget, objects:[]};
      data.push(proj); save(DB.projectsKey,data); redraw(search.value);
    });
    function editProject(id){
      const p = data.find(x=>x.id===id); if(!p) return alert('Не найдено');
      p.name = prompt('Название', p.name) || p.name;
      p.client = prompt('Клиент', p.client) || p.client;
      p.status = prompt('Статус', p.status) || p.status;
      p.budget = Number(prompt('Бюджет', p.budget) || p.budget);
      save(DB.projectsKey,data); redraw(search.value);
    }
    redraw('');
  }

  // --- Objects ---
  function renderObjects(){
    const list = document.getElementById('objects-list');
    const data = load(DB.objectsKey);
    const projects = load(DB.projectsKey);
    const search = document.getElementById('object-search');
    function redraw(filter=''){
      list.innerHTML = '';
      data.filter(o=>o.name.toLowerCase().includes(filter.toLowerCase())).forEach(o=>{
        const proj = projects.find(p=>p.id===o.projectId);
        const li = document.createElement('li');
        li.innerHTML = `<strong>${o.name}</strong> — ${o.address || ''} — проект: ${proj?proj.name:'-'} — статус: ${o.status || ''} <button data-id="${o.id}" class="edit">Ред.</button> <button data-id="${o.id}" class="del">Уд.</button>`;
        list.appendChild(li);
      });
      list.querySelectorAll('.edit').forEach(b=> b.addEventListener('click', e=> editObject(e.target.dataset.id)));
      list.querySelectorAll('.del').forEach(b=> b.addEventListener('click', e=>{ if(confirm('Удалить объект?')){ const idx = data.findIndex(x=>x.id===e.target.dataset.id); if(idx>=0){ data.splice(idx,1); save(DB.objectsKey,data); renderObjects(); }}}));
    }
    document.getElementById('add-object').addEventListener('click', ()=>{
      const name = prompt('Название объекта'); if(!name) return;
      const projectId = prompt('ID проекта (оставьте пустым чтобы выбрать первый)') || (projects[0] && projects[0].id) || null;
      const address = prompt('Адрес')||'';
      const obj = {id:uid('obj'), name, projectId, status:'planning', address};
      data.push(obj); save(DB.objectsKey,data); redraw(search.value);
    });
    function editObject(id){
      const o = data.find(x=>x.id===id); if(!o) return alert('Не найдено');
      o.name = prompt('Название', o.name) || o.name;
      o.address = prompt('Адрес', o.address) || o.address;
      o.status = prompt('Статус', o.status) || o.status;
      save(DB.objectsKey,data); redraw(search.value);
    }
    search.addEventListener('input', ()=> redraw(search.value));
    redraw('');
  }

  // --- Tasks ---
  function renderTasks(){
    const list = document.getElementById('tasks-list');
    let data = load(DB.tasksKey);
    const users = load(DB.usersKey);
    const projects = load(DB.projectsKey);
    const filter = document.getElementById('filter-status');
    function redraw(){
      list.innerHTML='';
      const f = filter.value;
      data.filter(t=> f==='all' ? true : t.status===f).forEach(t=>{
        const li = document.createElement('li');
        const user = users.find(u=>u.id===t.assignedTo);
        const proj = projects.find(p=>p.id===t.projectId);
        li.innerHTML = `<strong>${t.title}</strong> — ${t.status} — ${user?user.name:'не назначен'} — проект: ${proj?proj.name:'-'} <button data-id="${t.id}" class="edit">Ред.</button> <button data-id="${t.id}" class="del">Уд.</button>`;
        list.appendChild(li);
      });
      list.querySelectorAll('.edit').forEach(b=> b.addEventListener('click', e=> editTask(e.target.dataset.id)));
      list.querySelectorAll('.del').forEach(b=> b.addEventListener('click', e=>{ if(confirm('Удалить?')){ data = data.filter(x=>x.id!==e.target.dataset.id); save(DB.tasksKey,data); renderTasks(); }}));
    }
    document.getElementById('add-task').addEventListener('click', ()=>{
      const title = prompt('Название задачи'); if(!title) return;
      const projectId = prompt('ID проекта (опционально)') || null;
      const assignedTo = prompt('ID сотрудника (опционально)') || null;
      const t = {id:uid('task'), title, status:'todo', assignedTo, projectId, objectId:null, due:null, notes:''};
      data.push(t); save(DB.tasksKey,data); redraw();
    });
    function editTask(id){
      const t = data.find(x=>x.id===id); if(!t) return;
      t.title = prompt('Название', t.title) || t.title;
      t.status = prompt('Статус (todo|inprogress|done)', t.status) || t.status;
      t.assignedTo = prompt('ID сотрудника', t.assignedTo) || t.assignedTo;
      t.notes = prompt('Заметки', t.notes) || t.notes;
      save(DB.tasksKey,data); redraw();
    }
    filter.addEventListener('change', redraw);
    redraw();
  }

  // --- Finance ---
  function renderFinance(){
    const table = document.getElementById('finance-table').querySelector('tbody');
    let data = load(DB.financeKey);
    const projects = load(DB.projectsKey);
    function redraw(){
      table.innerHTML='';
      data.forEach((e,i)=>{
        const proj = projects.find(p=>p.id===e.projectId);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${e.date}</td><td>${e.type}</td><td>${e.amount}</td><td>${proj?proj.name:''}</td><td>${e.note||''}</td><td><button data-i="${i}" class="del">Уд.</button></td>`;
        table.appendChild(tr);
      });
      table.querySelectorAll('.del').forEach(b=> b.addEventListener('click', e=>{ if(confirm('Удалить запись?')){ data.splice(Number(e.target.dataset.i),1); save(DB.financeKey,data); renderFinance(); }}));
    }
    document.getElementById('add-entry').addEventListener('click', ()=>{
      const type = prompt('Тип (income|expense)', 'expense');
      const amount = Number(prompt('Сумма', '0')||0);
      const date = prompt('Дата (YYYY-MM-DD)', (new Date()).toISOString().slice(0,10));
      const projectId = prompt('ID проекта (опционально)') || null;
      const note = prompt('Описание')||'';
      data.push({id:uid('fin'), type, amount, date, projectId, note}); save(DB.financeKey,data); redraw();
    });
    redraw();
  }

  // --- Docs ---
  function renderDocs(){
    let data = load(DB.docsKey);
    const list = document.getElementById('docs-list');
    function redraw(){
      list.innerHTML='';
      data.forEach(d=>{
        const li = document.createElement('li');
        li.innerHTML = `<strong>${d.title}</strong> — ${d.filename||''} <button data-id="${d.id}" class="down">Скачать</button> <button data-id="${d.id}" class="del">Уд.</button>`;
        list.appendChild(li);
      });
      list.querySelectorAll('.down').forEach(b=> b.addEventListener('click', e=> downloadDoc(e.target.dataset.id)));
      list.querySelectorAll('.del').forEach(b=> b.addEventListener('click', e=>{ if(confirm('Удалить документ?')){ data = data.filter(x=>x.id!==e.target.dataset.id); save(DB.docsKey,data); renderDocs(); }}));
    }
    document.getElementById('upload-doc').addEventListener('click', ()=>{
      const input = document.getElementById('doc-file');
      const title = document.getElementById('doc-title').value || (input.files[0] && input.files[0].name) || 'Без названия';
      if(!input.files[0]) return alert('Выберите файл');
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = (ev)=>{
        data.push({id:uid('doc'), title, filename: file.name, mime: file.type, content: ev.target.result, uploaded: (new Date()).toISOString()});
        save(DB.docsKey,data); renderDocs();
      };
      reader.readAsDataURL(file);
    });
    function downloadDoc(id){
      const d = data.find(x=>x.id===id); if(!d) return;
      const a = document.createElement('a'); a.href = d.content; a.download = d.filename || d.title; document.body.appendChild(a); a.click(); a.remove();
    }
    redraw();
  }

  // --- Users ---
  function renderUsers(){
    let data = load(DB.usersKey);
    const list = document.getElementById('users-list');
    function redraw(){
      list.innerHTML='';
      data.forEach(u=>{
        const li = document.createElement('li');
        li.innerHTML = `<strong>${u.name}</strong> — ${u.role || ''} <button data-id="${u.id}" class="edit">Ред.</button> <button data-id="${u.id}" class="del">Уд.</button>`;
        list.appendChild(li);
      });
      list.querySelectorAll('.edit').forEach(b=> b.addEventListener('click', e=> editUser(e.target.dataset.id)));
      list.querySelectorAll('.del').forEach(b=> b.addEventListener('click', e=>{ if(confirm('Удалить?')){ data = data.filter(x=>x.id!==e.target.dataset.id); save(DB.usersKey,data); renderUsers(); }}));
    }
    document.getElementById('add-user').addEventListener('click', ()=>{
      const name = prompt('ФИО'); if(!name) return;
      const role = prompt('Роль')||'';
      const u = {id:uid('user'), name, role, phone:'', email:''};
      data.push(u); save(DB.usersKey,data); redraw();
    });
    function editUser(id){
      const u = data.find(x=>x.id===id); if(!u) return;
      u.name = prompt('ФИО', u.name) || u.name;
      u.role = prompt('Роль', u.role) || u.role;
      save(DB.usersKey,data); redraw();
    }
    redraw();
  }

  // --- Export / Import ---
  function renderExport(){
    document.getElementById('export-json').addEventListener('click', ()=>{
      const all = {
        projects: load(DB.projectsKey),
        objects: load(DB.objectsKey),
        tasks: load(DB.tasksKey),
        finance: load(DB.financeKey),
        docs: load(DB.docsKey),
        users: load(DB.usersKey)
      };
      const txt = JSON.stringify(all, null, 2);
      const pre = document.getElementById('export-output');
      pre.innerText = txt;
      const blob = new Blob([txt], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'crm_export.json'; document.body.appendChild(a); a.click(); a.remove();
    });
    document.getElementById('import-button').addEventListener('click', ()=>{
      const f = document.getElementById('import-json').files[0];
      if(!f) return alert('Выберите JSON файл');
      const r = new FileReader();
      r.onload = ev => {
        try{
          const parsed = JSON.parse(ev.target.result);
          if(parsed.projects) save(DB.projectsKey, parsed.projects);
          if(parsed.objects) save(DB.objectsKey, parsed.objects);
          if(parsed.tasks) save(DB.tasksKey, parsed.tasks);
          if(parsed.finance) save(DB.financeKey, parsed.finance);
          if(parsed.docs) save(DB.docsKey, parsed.docs);
          if(parsed.users) save(DB.usersKey, parsed.users);
          alert('Импорт завершён');
        }catch(e){ alert('Ошибка при чтении JSON'); }
      };
      r.readAsText(f);
    });
    document.getElementById('clear-all').addEventListener('click', ()=>{ if(confirm('Очистить все локальные данные?')){ Object.values(DB).forEach(k=>localStorage.removeItem(k)); alert('Удалено. Обновите страницу.'); }});
  }

  // стартовая страница
  navigate('dashboard');

  // горячие клавиши (пример): Ctrl+1..7
  document.addEventListener('keydown', e=>{
    if(!e.ctrlKey) return;
    const map = {Digit1:'dashboard', Digit2:'projects', Digit3:'objects', Digit4:'tasks', Digit5:'finance', Digit6:'docs', Digit7:'users'};
    if(map[e.code]) navigate(map[e.code]);
  });

  </script>
</body>
</html>
